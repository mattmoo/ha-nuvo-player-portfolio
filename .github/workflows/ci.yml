name: CI

on:
  push:
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[shim,test]" uvicorn
      - run: pytest -q --cov --cov-report=term-missing --cov-fail-under=85

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_ha_test.txt
      - run: pytest -q tests_ha -o pythonpath=. --cov=custom_components.nuvo_player --cov-report=term-missing

  home-assistant-latest:
    # The newest HA release (what most users run); the job above stays on the pinned one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component pytest-cov
      - name: Install the async-upnp-client version HA pins
        run: |
          ha=$(python -c "import importlib.util; print(importlib.util.find_spec('homeassistant').submodule_search_locations[0])")
          pin=$(jq -r '.requirements[] | select(startswith("async-upnp-client"))' "$ha/components/ssdp/manifest.json")
          pip install "$pin"
          python -c "import homeassistant.const as c; print('HA', c.__version__)"
      - run: pytest -q tests_ha -o pythonpath=.

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Custom integration: not listed in home-assistant/brands.
          ignore: brands
