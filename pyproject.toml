[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aionuvo"
version = "0.3.2"
description = "Async client for Legrand Nuvo Player Portfolio zones (UPnP/SOAP)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["async-upnp-client>=0.44", "aiohttp>=3.9"]

[project.optional-dependencies]
shim = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "httpx"]

[tool.setuptools]
packages = ["aionuvo"]

[tool.setuptools.package-dir]
# The library lives inside the HA integration so HACS ships it (no PyPI package).
aionuvo = "custom_components/nuvo_player/aionuvo"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["custom_components/nuvo_player", "."]

[tool.coverage.run]
source = ["aionuvo"]
